<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chatbot</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <div class="chat-topbar">
      <div class="chat-brand">
        <div class="chat-avatar" aria-hidden="true">G</div>
        <div>
          <h1>Gemini AI Question Generator</h1>
          <p class="chat-subtitle">A fast and concise learning aid</p>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-text">Dark</span>
      </button>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
